name: Build macOS App

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt5 pyinstaller

      - name: Build macOS app
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name DesktopTodo todo.py

      - name: Compress app
        run: |
          cd dist
          zip -r DesktopTodo-mac.zip DesktopTodo.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopTodo-mac
          path: dist/DesktopTodo-mac.zip
